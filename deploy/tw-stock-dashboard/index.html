function extMerge(rec) {
  if (!rec) return rec;
  const ext = STOCK_HISTORY_EXT[rec.date + '|' + rec.code];
  return Object.assign({}, rec, {
    instForeign: ext ? ext[0] : null,
    instTrust: ext ? ext[1] : null,
    instDealer: ext ? ext[2] : null
  });
}
function getStockRecord(code, date) {
  let rec = STOCK_HISTORY.find(r => r.code === code && r.date === date);
  if (rec) return extMerge(rec);
  const candidates = STOCK_HISTORY.filter(r => r.code === code && r.date <= date).sort((a,b)=>b.date.localeCompare(a.date));
  return candidates[0] ? extMerge(candidates[0]) : null;
}

  const recs = STOCK_HISTORY.filter(r => r.code === code && r.date >= start && r.date <= end).sort((a,b)=>a.date.localeCompare(b.date)).map(extMerge);
  if (recs.length === 0) return null;
  const first = recs[0], last = recs[recs.length - 1];
  const vol = recs.reduce((s,r) => s + (r.vol || 0), 0);

// ============ 三大法人堆疊長條數字標籤 plugin（僅用於「各產業個股」圖，透過 chart 層級 plugins 陣列套用，不全域註冊） ============
const instStackLabelPlugin = {
  id: 'instStackLabels',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((dataset, dsIndex) => {
      const meta = chart.getDatasetMeta(dsIndex);
      meta.data.forEach((bar, index) => {
        const raw = dataset.data[index];
        if (raw === null || raw === undefined || raw === 0) return;
        const val = Math.round(raw);
        const label = (val >= 0 ? '+' : '−') + Math.abs(val).toLocaleString();
        const props = bar.getProps(['x','y','base'], true);
        const segStart = Math.min(props.x, props.base);
        const segEnd = Math.max(props.x, props.base);
        const segWidth = segEnd - segStart;
        ctx.save();
        ctx.font = '600 10px -apple-system, "PingFang TC", sans-serif';
        ctx.textBaseline = 'middle';
        const textWidth = ctx.measureText(label).width;
        if (segWidth >= textWidth + 6) {
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.fillText(label, (segStart + segEnd) / 2, props.y);
        } else {
          ctx.fillStyle = '#333';
          if (val >= 0) {
            ctx.textAlign = 'left';
            ctx.fillText(label, segEnd + 3, props.y);
          } else {
            ctx.textAlign = 'right';
            ctx.fillText(label, segStart - 3, props.y);
          }
        }
        ctx.restore();
      });
    });
  }
};

function fmtSigned(n, unit) {
  if (n === null || n === undefined) return '—';
  const sign = n > 0 ? '▲' : (n < 0 ? '▼' : '');
  const cls = n > 0 ? 'up' : (n < 0 ? 'down' : 'flat');
  return `<span class="${cls}">${sign}${Math.abs(n).toLocaleString()}${unit||''}</span>`;
}

// ============ Tabs ============
const tabsEl = document.getElementById('tabs');
const groupNames = Object.keys(GROUPS);
const FLOW_TAB = '權值股資金流';
let activeCharts = [];
let currentGroup = groupNames[0];

const GROUPS_TAB = '追蹤群組';
const groupsTabBtn = document.createElement('button');
groupsTabBtn.className = 'tab-btn active';
groupsTabBtn.textContent = '📋 ' + GROUPS_TAB;
groupsTabBtn.onclick = () => selectTab(GROUPS_TAB, groupsTabBtn);
tabsEl.appendChild(groupsTabBtn);

const flowBtn = document.createElement('button');
flowBtn.className = 'tab-btn';
flowBtn.textContent = '📈 ' + FLOW_TAB;
flowBtn.onclick = () => selectTab(FLOW_TAB, flowBtn);
tabsEl.appendChild(flowBtn);

const INDUSTRY_FLOW_TAB = '產業資金流向';
const industryFlowBtn = document.createElement('button');
industryFlowBtn.className = 'tab-btn';
industryFlowBtn.textContent = '🏭 ' + INDUSTRY_FLOW_TAB;
industryFlowBtn.onclick = () => selectTab(INDUSTRY_FLOW_TAB, industryFlowBtn);
tabsEl.appendChild(industryFlowBtn);

const SEARCH_TAB = '歷史查詢';
const searchTabBtn = document.createElement('button');
searchTabBtn.className = 'tab-btn';
searchTabBtn.textContent = '🔍 ' + SEARCH_TAB;
searchTabBtn.onclick = () => selectTab(SEARCH_TAB, searchTabBtn);
tabsEl.appendChild(searchTabBtn);

function selectTab(g, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  if (g === FLOW_TAB) renderFlowTab();
  else if (g === INDUSTRY_FLOW_TAB) renderIndustryFlowTab();
  else if (g === SEARCH_TAB) renderSearchTab();
  else if (g === GROUPS_TAB) renderGroupsTab();
}

const INDUSTRY_COLOR = {};
const PALETTE = ['#5b8def','#f2994a','#9b59b6','#16a085','#e74c3c','#2c3e50','#e67e22','#27ae60','#2980b9','#8e44ad','#c0392b','#7f8c8d','#d35400','#1abc9c'];
function industryColor(ind) {
  if (!INDUSTRY_COLOR[ind]) {
    INDUSTRY_COLOR[ind] = PALETTE[Object.keys(INDUSTRY_COLOR).length % PALETTE.length];
  }
  return INDUSTRY_COLOR[ind];
}

function destroyCharts() {
  activeCharts.forEach(c => c.destroy());
  activeCharts = [];
}

function renderGroupsTab() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const subtabBar = document.createElement('div');
  subtabBar.className = 'subtabs';
  groupNames.forEach(g => {
    const sbtn = document.createElement('button');
    sbtn.className = 'subtab-btn' + (g === currentGroup ? ' active' : '');
    sbtn.textContent = g + `（${GROUPS[g].length}檔）`;
    sbtn.onclick = () => { currentGroup = g; renderGroupsTab(); };
    subtabBar.appendChild(sbtn);
  });
  content.appendChild(subtabBar);

  const groupBody = document.createElement('div');
  groupBody.id = 'groupBody';
  content.appendChild(groupBody);

  renderGroup(currentGroup, groupBody);
}

function renderGroup(g, container, dateOverride, mode, rangeStart, rangeEnd) {
  destroyCharts();
  mode = mode || 'single';
  const isRange = mode === 'range';
  const date = dateOverride || AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
  const rStart = rangeStart || AVAILABLE_DATES[0];
  const rEnd = rangeEnd || AVAILABLE_DATES[AVAILABLE_DATES.length - 1];

  const data = GROUPS[g].map(m => {
    const rec = isRange ? getStockRangeAgg(m.code, rStart, rEnd) : getStockRecord(m.code, date);
    return rec ? { code: m.code, name: m.name, industry: m.industry, market: m.market,
                   close: rec.close, chg: rec.chg, vol: rec.vol, inst: rec.inst,
                   instForeign: rec.instForeign, instTrust: rec.instTrust, instDealer: rec.instDealer }
                : m;
  });
  container.innerHTML = '';

  // ---- 單日／區間 模式切換 + 日期選擇 ----
  const dateBar = document.createElement('div');
  dateBar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;';
  dateBar.innerHTML = `<label style="font-size:12px;color:#666;">📅 查看模式：</label>
    <select class="modeSel" style="padding:5px 10px;border-radius:8px;border:1px solid #ddd;font-size:13px;">
      <option value="single">單日</option>
      <option value="range">區間</option>
    </select>`;
  container.appendChild(dateBar);
  const modeSel = dateBar.querySelector('.modeSel');
  modeSel.value = mode;
  modeSel.onchange = () => renderGroup(g, container, date, modeSel.value, rStart, rEnd);

  if (!isRange) {
    const singleWrap = document.createElement('span');
    singleWrap.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    singleWrap.innerHTML = `<span class="dateMount"></span>
      <span style="font-size:11px;color:#999;">（可查看近${AVAILABLE_DATES.length}個交易日的收盤與法人買賣超，選到非交易日會自動顯示最近一個交易日）</span>`;
    dateBar.appendChild(singleWrap);
    const dateSel = mountDatePicker(singleWrap.querySelector('.dateMount'), AVAILABLE_DATES[0], AVAILABLE_DATES[AVAILABLE_DATES.length-1], date);
    dateSel.onchange = () => renderGroup(g, container, dateSel.value, 'single', rStart, rEnd);
  } else {
    const rangeWrap = document.createElement('span');
    rangeWrap.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    rangeWrap.innerHTML = `<label style="font-size:12px;color:#666;">起：</label>
      <span class="startMount"></span>
      <label style="font-size:12px;color:#666;">迄：</label>
      <span class="endMount"></span>
      <span style="font-size:11px;color:#999;">（區間內每檔加總／期末收盤，與期初比較漲跌）</span>`;
    dateBar.appendChild(rangeWrap);
    const startSel = mountDatePicker(rangeWrap.querySelector('.startMount'), AVAILABLE_DATES[0], AVAILABLE_DATES[AVAILABLE_DATES.length-1], rStart);
    const endSel = mountDatePicker(rangeWrap.querySelector('.endMount'), AVAILABLE_DATES[0], AVAILABLE_DATES[AVAILABLE_DATES.length-1], rEnd);
    startSel.onchange = () => renderGroup(g, container, date, 'range', startSel.value, endSel.value);
    endSel.onchange = () => renderGroup(g, container, date, 'range', startSel.value, endSel.value);
  }

  // ---- 產業別總覽 chart ----
  const byIndustry = {};
  data.forEach(s => {
    if (!byIndustry[s.industry]) byIndustry[s.industry] = 0;
    if (s.inst !== null && s.inst !== undefined) byIndustry[s.industry] += s.inst;
  });
  const industries = Object.keys(byIndustry).sort((a,b) => byIndustry[b]-byIndustry[a]);

  const overviewCard = document.createElement('div');
  overviewCard.className = 'chart-card';
  overviewCard.innerHTML = isRange
    ? `<h3>📌 ${g}｜各產業三大法人買賣超總覽（張）（期間累計）</h3><div style="font-size:11px;color:#999;margin:-2px 0 8px 2px;">統計區間：${rStart} ～ ${rEnd}</div><div class="overview-chart"><canvas></canvas></div>`
    : `<h3>📌 ${g}｜各產業三大法人買賣超總覽（張）</h3><div class="overview-chart"><canvas></canvas></div>`;
  container.appendChild(overviewCard);
  const ovCanvas = overviewCard.querySelector('canvas');
  const ovChart = new Chart(ovCanvas, {
    type: 'bar',
    data: {
      labels: industries,
      datasets: [{
        data: industries.map(x => byIndustry[x]),
        backgroundColor: industries.map(x => byIndustry[x] >= 0 ? '#d32f2f' : '#2e7d32'),
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: 'y',
      layout: { padding: { right: 70, left: 4 } },
      plugins: { legend: { display:false }, tooltip: { callbacks: { label: (ctx)=>`${ctx.raw>=0?'買超':'賣超'} ${Math.abs(ctx.raw).toLocaleString()} 張` } } },
      scales: { x: { ticks: { callback: v => v.toLocaleString() } } }
    }
  });
  activeCharts.push(ovChart);

  // ---- 大戶持股比例排行（獨立清單，資料來源：集保結算所週資料）----
  const holderRows = data
    .map(s => (MAJOR_HOLDER[s.code] ? { code: s.code, name: s.name, industry: s.industry,
                pct: MAJOR_HOLDER[s.code].pct, holderCount: MAJOR_HOLDER[s.code].holderCount,
                asOf: MAJOR_HOLDER[s.code].date } : null))
    .filter(Boolean)
    .sort((a, b) => b.pct - a.pct);
  const holderCard = document.createElement('div');
  holderCard.className = 'chart-card';
  const holderAsOf = holderRows.length ? holderRows[0].asOf : '';
  holderCard.innerHTML = `<h3>🏦 ${g}｜大戶持股比例排行（千張以上大戶，占集保庫存比例）</h3>
    <div style="font-size:11px;color:#999;margin:-2px 0 8px 2px;">資料來源：集保結算所股權分散表；統計基準日 ${holderAsOf}；僅列持股1,000張(100萬股)以上大戶合計占集保庫存比例，與上方日期選擇無關（週資料，非逐日更新）</div>
    <div class="holder-rank-body"></div>`;
  container.appendChild(holderCard);
  const holderBody = holderCard.querySelector('.holder-rank-body');
  holderBody.innerHTML = holderRows.length ? `<table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="text-align:left;color:#666;border-bottom:1px solid #eee;">
        <th style="padding:6px 4px;">排名</th><th style="padding:6px 4px;">股票</th><th style="padding:6px 4px;">產業</th>
        <th style="padding:6px 4px;text-align:right;">大戶持股比例</th><th style="padding:6px 4px;text-align:right;">大戶人數</th>
      </tr></thead>
      <tbody>${holderRows.map((r, idx) => `<tr style="border-bottom:1px solid #f5f5f5;">
        <td style="padding:6px 4px;color:#999;">${idx + 1}</td>
        <td style="padding:6px 4px;">${r.code} ${r.name}</td>
        <td style="padding:6px 4px;color:${industryColor(r.industry)};">${r.industry}</td>
        <td style="padding:6px 4px;text-align:right;font-weight:600;">${r.pct.toFixed(2)}%</td>
        <td style="padding:6px 4px;text-align:right;color:#999;">${r.holderCount.toLocaleString()}</td>
      </tr>`).join('')}</tbody>
    </table>` : `<div style="font-size:13px;color:#999;padding:8px 4px;">此群組目前無大戶持股資料</div>`;


  // ---- 各產業個股 chart（外資/投信/自營商三色堆疊） ----
  const grid = document.createElement('div');
  grid.className = 'industry-grid';
  container.appendChild(grid);

  const instTypeLegend = document.createElement('div');
  instTypeLegend.style.cssText = 'font-size:11px;color:#666;margin:0 0 10px 2px;';
  instTypeLegend.innerHTML = `<span class="legend-dot" style="background:#5b8def"></span>外資　<span class="legend-dot" style="background:#9b59b6"></span>投信　<span class="legend-dot" style="background:#f2994a"></span>自營商　（正值買超、負值賣超，張；下方各產業個股圖為三大法人細項堆疊，與上方「產業別總覽」圖的紅綠買賣超配色意義不同）`;
  container.appendChild(instTypeLegend);

  industries.forEach(ind => {
    const stocks = data.filter(s => s.industry === ind).sort((a,b) => (b.inst||0)-(a.inst||0));
    const card = document.createElement('div');
    card.className = 'chart-card';
    const h = Math.max(110, stocks.length * 34);
    card.innerHTML = `<h3 style="color:${industryColor(ind)}">● ${ind}（${stocks.length}檔）</h3><div class="stock-chart" style="height:${h}px"><canvas></canvas></div>`;
    grid.appendChild(card);
    const canvas = card.querySelector('canvas');
    const chart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: stocks.map(s => `${s.code} ${s.name}`),
        datasets: [
          { label: '外資', data: stocks.map(s => s.instForeign ?? 0), backgroundColor: '#5b8def', stack: 'inst', borderRadius: 3 },
          { label: '投信', data: stocks.map(s => s.instTrust ?? 0), backgroundColor: '#9b59b6', stack: 'inst', borderRadius: 3 },
          { label: '自營商', data: stocks.map(s => s.instDealer ?? 0), backgroundColor: '#f2994a', stack: 'inst', borderRadius: 3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        indexAxis: 'y',
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { right: 75, left: 4 } },
        plugins: {
          legend: { display:false },
          valueLabels: false,
          tooltip: {
            callbacks: {
              title: (items) => {
                const s = stocks[items[0].dataIndex];
                return s ? `${s.code} ${s.name}` : '';
              },
              label: (ctx) => {
                const v = ctx.raw || 0;
                return `${ctx.dataset.label}：${v>=0?'+':''}${v.toLocaleString()} 張`;
              },
              afterBody: (items) => {
                const s = stocks[items[0].dataIndex];
                const chgTxt = s.chg > 0 ? `▲${s.chg}` : (s.chg < 0 ? `▼${Math.abs(s.chg)}` : '平盤');
                const priceLines = isRange
                  ? [`期末收盤 ${s.close}（期間漲跌 ${chgTxt}）`, `期間成交量合計 ${s.vol.toLocaleString()} 張`]
                  : [`收盤 ${s.close} (${chgTxt})`, `成交量 ${s.vol.toLocaleString()} 張`];
                const total = s.inst || 0;
                return priceLines.concat([`合計：${total>=0?'+':''}${total.toLocaleString()} 張`]);
              }
            }
          }
        },
        scales: {
          x: { stacked: true, ticks: { callback: v => v.toLocaleString() } },
          y: { stacked: true }
        }
      },
      plugins: [instStackLabelPlugin]
    });
    activeCharts.push(chart);
  });

  const legend = document.createElement('div');
  legend.className = 'legend-row';
  legend.innerHTML = `<span><span class="legend-dot" style="background:#d32f2f"></span>法人買超 / 股價上漲</span><span><span class="legend-dot" style="background:#2e7d32"></span>法人賣超 / 股價下跌</span>`;
  container.appendChild(legend);
}

function buildCandleDatasets(history) {
  return [
    {
      label: '影線',
      data: history.map(d => [d.low, d.high]),
      backgroundColor: history.map(d => d.close >= d.open ? '#d32f2f' : '#2e7d32'),
      barPercentage: 0.12, categoryPercentage: 0.9,
      grouped: false, order: 1,
    },
    {
      label: '實體',
      data: history.map(d => [Math.min(d.open,d.close), Math.max(d.open,d.close)]),
      backgroundColor: history.map(d => d.close >= d.open ? '#d32f2f' : '#2e7d32'),
      barPercentage: 0.55, categoryPercentage: 0.9,
      grouped: false, order: 0,
    },
  ];
}

function fmtDate(d) { const [y,m,day] = d.split('-'); return `${m}/${day}`; }

// ============ 輕量自製日期選擇器（原生 input[type=date] 的年份快速跳轉清單不受 min/max 限制，會列出資料範圍外的年份，改用自製月曆避免混淆）============
function mountDatePicker(mountEl, min, max, value) {
  const state = { value };
  const api = {
    get value() { return state.value; },
    set value(v) { state.value = v; btn.textContent = fmtVal(v) + ' 📅'; },
    onchange: null
  };

  function fmtVal(s) { return s.replace(/-/g, '/'); }
  function ymOf(s) { const [y, m] = s.split('-').map(Number); return { y, m }; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

  const wrap = document.createElement('span');
  wrap.style.cssText = 'position:relative;display:inline-block;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = fmtVal(value) + ' 📅';
  btn.style.cssText = 'padding:5px 10px;border-radius:8px;border:1px solid #ddd;font-size:13px;background:#fff;cursor:pointer;color:#1d1d1f;';
  const popup = document.createElement('div');
  popup.style.cssText = 'position:absolute;top:calc(100% + 4px);left:0;z-index:100;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.15);padding:10px;display:none;width:224px;';
  wrap.appendChild(btn);
  wrap.appendChild(popup);
  mountEl.appendChild(wrap);

  let viewY, viewM;

  function render() {
    popup.innerHTML = '';
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;';
    const minYm = ymOf(min), maxYm = ymOf(max);

    const yearSel = document.createElement('select');
    yearSel.style.cssText = 'font-size:12px;font-weight:600;border:1px solid #ddd;border-radius:6px;padding:3px 4px;background:#fff;';
    for (let y = minYm.y; y <= maxYm.y; y++) {
      const opt = document.createElement('option'); opt.value = String(y); opt.textContent = y + '年';
      if (y === viewY) opt.selected = true;
      yearSel.appendChild(opt);
    }
    yearSel.onchange = () => {
      viewY = Number(yearSel.value);
      const loM2 = (viewY === minYm.y) ? minYm.m : 1;
      const hiM2 = (viewY === maxYm.y) ? maxYm.m : 12;
      if (viewM < loM2) viewM = loM2;
      if (viewM > hiM2) viewM = hiM2;
      render();
    };

    const loM = (viewY === minYm.y) ? minYm.m : 1;
    const hiM = (viewY === maxYm.y) ? maxYm.m : 12;
    const monthSel = document.createElement('select');
    monthSel.style.cssText = 'font-size:12px;font-weight:600;border:1px solid #ddd;border-radius:6px;padding:3px 4px;background:#fff;';
    for (let mm = loM; mm <= hiM; mm++) {
      const opt = document.createElement('option'); opt.value = String(mm); opt.textContent = mm + '月';
      if (mm === viewM) opt.selected = true;
      monthSel.appendChild(opt);
    }
    monthSel.onchange = () => { viewM = Number(monthSel.value); render(); };

    head.appendChild(yearSel);
    head.appendChild(monthSel);
    popup.appendChild(head);

    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;';
    ['日','一','二','三','四','五','六'].forEach(d => {
      const c = document.createElement('div'); c.textContent = d;
      c.style.cssText = 'color:#999;font-size:10px;padding:2px 0;';
      grid.appendChild(c);
    });
    const firstDow = new Date(viewY, viewM - 1, 1).getDay();
    for (let i = 0; i < firstDow; i++) grid.appendChild(document.createElement('div'));
    const dim = daysInMonth(viewY, viewM);
    for (let d = 1; d <= dim; d++) {
      const dateStr = `${viewY}-${pad(viewM)}-${pad(d)}`;
      const cell = document.createElement('div');
      cell.textContent = String(d);
      const disabled = dateStr < min || dateStr > max;
      const selected = dateStr === state.value;
      cell.style.cssText = `padding:4px 0;border-radius:6px;font-size:12px;cursor:${disabled ? 'default' : 'pointer'};color:${disabled ? '#ccc' : (selected ? '#fff' : '#333')};background:${selected ? '#1d1d1f' : 'transparent'};`;
      if (!disabled) {
        cell.onclick = () => {
          state.value = dateStr;
          btn.textContent = fmtVal(dateStr) + ' 📅';
          popup.style.display = 'none';
          popup.classList.remove('__dp_open');
          if (typeof api.onchange === 'function') api.onchange();
        };
      }
      grid.appendChild(cell);
    }
    popup.appendChild(grid);
  }

  btn.onclick = (e) => {
    e.stopPropagation();
    const isOpen = popup.style.display === 'block';
    document.querySelectorAll('.__dp_open').forEach(p => { p.style.display = 'none'; p.classList.remove('__dp_open'); });
    if (!isOpen) {
      const vy = ymOf(state.value);
      viewY = vy.y; viewM = vy.m;
      render();
      popup.style.display = 'block';
      popup.classList.add('__dp_open');
    }
  };
  document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) { popup.style.display = 'none'; popup.classList.remove('__dp_open'); } });

  return api;
}

function renderFlowPanel(container, title, dotColor, history, topList) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `
    <h3 style="font-size:14px;"><span class="legend-dot" style="background:${dotColor}"></span>${title}</h3>
    <div style="font-size:11px;color:#999;margin:0 0 10px 2px;">追蹤標的：${topList}</div>
    <div style="font-size:12px;color:#666;margin:4px 0 4px 2px;">K線走勢</div>
    <div style="height:230px;position:relative;"><canvas id="${title}-candle"></canvas></div>
    <div style="font-size:12px;color:#666;margin:14px 0 4px 2px;">權值大戶單日與累計資金流（張）</div>
    <div style="height:230px;position:relative;"><canvas id="${title}-flow"></canvas></div>
  `;
  container.appendChild(card);

  const labels = history.map(d => fmtDate(d.date));

  const candleCanvas = card.querySelector(`#${CSS.escape(title+'-candle')}`);
  const candleChart = new Chart(candleCanvas, {
    type: 'bar',
    data: { labels, datasets: buildCandleDatasets(history) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display:false },
        valueLabels: false,
        tooltip: {
          callbacks: {
            title: (items) => history[items[0].dataIndex].date,
            label: (ctx) => {
              const d = history[ctx.dataIndex];
              return [`開 ${d.open}　高 ${d.high}`, `低 ${d.low}　收 ${d.close}`];
            }
          }
        }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 10, autoSkip: true } },
        y: { ticks: { callback: v => v.toLocaleString() } }
      }
    }
  });
  activeCharts.push(candleChart);

  const flowCanvas = card.querySelector(`#${CSS.escape(title+'-flow')}`);
  const flowChart = new Chart(flowCanvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: '單日資金流',
          data: history.map(d => d.dailyFlow),
          backgroundColor: history.map(d => d.dailyFlow >= 0 ? 'rgba(211,47,47,0.65)' : 'rgba(46,125,50,0.65)'),
          yAxisID: 'y',
          order: 2,
        },
        {
          type: 'line',
          label: '累計資金流',
          data: history.map(d => d.cumFlow),
          borderColor: '#1d3557',
          backgroundColor: 'rgba(29,53,87,0.08)',
          borderWidth: 2, pointRadius: 0, tension: 0.25, fill: true,
          yAxisID: 'y1',
          order: 1,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        valueLabels: false,
        legend: { display:true, position:'top', labels:{ boxWidth:10, font:{size:10} } },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}：${ctx.raw>=0?'+':''}${Math.round(ctx.raw).toLocaleString()} 張`
          }
        }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 10, autoSkip: true } },
        y: { position:'left', title:{display:true,text:'單日(張)',font:{size:10}}, ticks:{ font:{size:9}, callback: v=>v.toLocaleString() } },
        y1: { position:'right', title:{display:true,text:'累計(張)',font:{size:10}}, grid:{drawOnChartArea:false}, ticks:{ font:{size:9}, callback: v=>v.toLocaleString() } },
      }
    }
  });
  activeCharts.push(flowChart);
}

function computeWindowCum(history) {
  let cum = 0;
  return history.map(d => {
    cum += d.dailyFlow;
    return Object.assign({}, d, { cumFlow: cum });
  });
}

function renderFlowTab(rangeStart, rangeEnd) {
  destroyCharts();
  const content = document.getElementById('content');
  content.innerHTML = '';

  const allDates = TAIEX_HISTORY.map(d => d.date);
  const rStart = rangeStart || allDates[0];
  const rEnd = rangeEnd || allDates[allDates.length - 1];

  const dateBar = document.createElement('div');
  dateBar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;';
  dateBar.innerHTML = `<label style="font-size:12px;color:#666;">📅 起：</label>
    <span class="startMount"></span>
    <label style="font-size:12px;color:#666;">迄：</label>
    <span class="endMount"></span>`;
  content.appendChild(dateBar);
  const startSel = mountDatePicker(dateBar.querySelector('.startMount'), allDates[0], allDates[allDates.length-1], rStart);
  const endSel = mountDatePicker(dateBar.querySelector('.endMount'), allDates[0], allDates[allDates.length-1], rEnd);
  startSel.onchange = () => renderFlowTab(startSel.value, endSel.value);
  endSel.onchange = () => renderFlowTab(startSel.value, endSel.value);

  const grid = document.createElement('div');
  grid.className = 'industry-grid';
  content.appendChild(grid);
  const taiexRange = computeWindowCum(TAIEX_HISTORY.filter(d => d.date >= rStart && d.date <= rEnd));
  const tpexRange = computeWindowCum(TPEX_HISTORY.filter(d => d.date >= rStart && d.date <= rEnd));
  renderFlowPanel(grid, '上市加權指數(TAIEX)', '#d32f2f', taiexRange, TAIEX_TOP10);
  renderFlowPanel(grid, '櫃買指數(TPEX)', '#2e7d32', tpexRange, TPEX_TOP10);
  const legend = document.createElement('div');
  legend.className = 'legend-row';
  legend.innerHTML = `<span><span class="legend-dot" style="background:#d32f2f"></span>K線上漲／資金流入</span><span><span class="legend-dot" style="background:#2e7d32"></span>K線下跌／資金流出</span><span>藍線＝累計資金流（右軸，依所選區間重新累計）</span>`;
  content.appendChild(legend);
}

// ============ 產業資金流向分頁 ============
let indTrendChartInstance = null;

function renderIndustryFlowTab(rangeStart, rangeEnd, selectedIndustry) {
  destroyCharts();
  indTrendChartInstance = null;
  const content = document.getElementById('content');
  content.innerHTML = '';

  const industries = [...new Set(INDUSTRY_FLOW.map(r => r.industry))].sort();
  const allDates = [...new Set(INDUSTRY_FLOW.map(r => r.date))].sort();
  const rStart = rangeStart || allDates[0];
  const rEnd = rangeEnd || allDates[allDates.length - 1];
  const dates = allDates.filter(d => d >= rStart && d <= rEnd);
  const labels = dates.map(fmtDate);

  const lookup = {};
  INDUSTRY_FLOW.forEach(r => { lookup[r.date + '|' + r.industry] = r.inst; });

  const dateBar = document.createElement('div');
  dateBar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;';
  dateBar.innerHTML = `<label style="font-size:12px;color:#666;">📅 起：</label>
    <span class="startMount"></span>
    <label style="font-size:12px;color:#666;">迄：</label>
    <span class="endMount"></span>`;
  content.appendChild(dateBar);
  const startSel = mountDatePicker(dateBar.querySelector('.startMount'), allDates[0], allDates[allDates.length-1], rStart);
  const endSel = mountDatePicker(dateBar.querySelector('.endMount'), allDates[0], allDates[allDates.length-1], rEnd);
  startSel.onchange = () => renderIndustryFlowTab(startSel.value, endSel.value, indSel.value);
  endSel.onchange = () => renderIndustryFlowTab(startSel.value, endSel.value, indSel.value);

  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `<h3>📊 三大法人每日產業資金流向（張，堆疊長條）</h3>
    <div style="font-size:11px;color:#999;margin:0 0 10px 2px;">正值＝該產業當日合計買超，負值＝合計賣超；每天由${industries.length}個產業堆疊而成，共${dates.length}個交易日</div>
    <div style="height:440px;position:relative;"><canvas></canvas></div>`;
  content.appendChild(card);
  const canvas = card.querySelector('canvas');

  const datasets = industries.map(ind => ({
    label: ind,
    data: dates.map(d => lookup[d + '|' + ind] || 0),
    backgroundColor: industryColor(ind),
    stack: 'flow',
  }));

  const chart = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        valueLabels: false,
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}：${ctx.raw >= 0 ? '+' : ''}${ctx.raw.toLocaleString()} 張`
          }
        }
      },
      scales: {
        x: { stacked: true, ticks: { maxTicksLimit: 16, autoSkip: true } },
        y: { stacked: true, ticks: { callback: v => v.toLocaleString() } }
      }
    }
  });
  activeCharts.push(chart);

  const card2 = document.createElement('div');
  card2.className = 'chart-card';
  card2.innerHTML = `<h3>🔍 單一產業趨勢（單日＋累計）</h3>
    <select style="padding:5px 10px;border-radius:8px;border:1px solid #ddd;font-size:13px;margin-bottom:12px;"></select>
    <div style="height:280px;position:relative;"><canvas></canvas></div>`;
  content.appendChild(card2);
  const indSel = card2.querySelector('select');
  const trendCanvas = card2.querySelector('canvas');
  const defaultIndustry = (selectedIndustry && industries.includes(selectedIndustry)) ? selectedIndustry : industries[0];
  industries.forEach(ind => {
    const opt = document.createElement('option');
    opt.value = ind; opt.textContent = ind;
    if (ind === defaultIndustry) opt.selected = true;
    indSel.appendChild(opt);
  });

  function renderIndTrend(ind) {
    const vals = dates.map(d => lookup[d + '|' + ind] || 0);
    let cum = 0;
    const cumVals = vals.map(v => cum += v);
    if (indTrendChartInstance) {
      indTrendChartInstance.destroy();
      activeCharts = activeCharts.filter(c => c !== indTrendChartInstance);
    }
    const t = new Chart(trendCanvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { type: 'bar', label: '單日買賣超', data: vals,
            backgroundColor: vals.map(v => v >= 0 ? 'rgba(211,47,47,0.65)' : 'rgba(46,125,50,0.65)'),
            yAxisID: 'y', order: 2 },
          { type: 'line', label: '累計買賣超', data: cumVals,
            borderColor: '#1d3557', backgroundColor: 'rgba(29,53,87,0.08)',
            borderWidth: 2, pointRadius: 0, tension: 0.25, fill: true, yAxisID: 'y1', order: 1 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          valueLabels: false,
          legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}：${ctx.raw >= 0 ? '+' : ''}${ctx.raw.toLocaleString()} 張` } }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 12, autoSkip: true } },
          y: { position: 'left', ticks: { font: { size: 9 }, callback: v => v.toLocaleString() } },
          y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: 9 }, callback: v => v.toLocaleString() } }
        }
      }
    });
    indTrendChartInstance = t;
    activeCharts.push(t);
  }
  indSel.onchange = () => renderIndTrend(indSel.value);
  renderIndTrend(defaultIndustry);

  const legend = document.createElement('div');
  legend.className = 'legend-row';
  legend.innerHTML = `<span><span class="legend-dot" style="background:#d32f2f"></span>買超</span><span><span class="legend-dot" style="background:#2e7d32"></span>賣超</span><span>深藍線＝累計買賣超（右軸，依所選區間重新累計）</span>`;
  content.appendChild(legend);
}

// ============ 歷史查詢分頁 ============
function renderSearchTab() {
  destroyCharts();
  const content = document.getElementById('content');
  content.innerHTML = '';

  const industries = [...new Set(STOCK_HISTORY.map(r => r.industry))].sort();
  const minDate = AVAILABLE_DATES[0];
  const maxDate = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];

  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `
    <h3>🔍 個股歷史買賣超查詢</h3>
    <div style="font-size:11px;color:#999;margin:0 0 12px 2px;">可用代號、名稱、產業別、日期區間篩選，資料涵蓋 ${minDate} ～ ${maxDate}（共${AVAILABLE_DATES.length}個交易日）</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <input id="searchText" type="text" placeholder="輸入代號或名稱關鍵字" style="flex:1;min-width:160px;padding:7px 12px;border-radius:8px;border:1px solid #ddd;font-size:13px;">
      <select id="searchIndustry" style="padding:7px 12px;border-radius:8px;border:1px solid #ddd;font-size:13px;">
        <option value="">全部產業</option>
        ${industries.map(i => `<option value="${i}">${i}</option>`).join('')}
      </select>
      <span id="searchStartMount"></span>
      <span style="align-self:center;color:#999;font-size:12px;">至</span>
      <span id="searchEndMount"></span>
      <button id="searchBtn" style="padding:7px 18px;border-radius:8px;border:none;background:#1d1d1f;color:#fff;font-size:13px;cursor:pointer;">查詢</button>
    </div>
    <div id="searchCount" style="font-size:12px;color:#666;margin-bottom:8px;"></div>
    <div id="searchGrid"></div>
  `;
  content.appendChild(card);

  const searchStartPicker = mountDatePicker(document.getElementById('searchStartMount'), minDate, maxDate, minDate);
  const searchEndPicker = mountDatePicker(document.getElementById('searchEndMount'), minDate, maxDate, maxDate);

  let gridInstance = null;

  function runSearch() {
    const kw = document.getElementById('searchText').value.trim().toLowerCase();
    const ind = document.getElementById('searchIndustry').value;
    const start = searchStartPicker.value;
    const end = searchEndPicker.value;

    const rows = STOCK_HISTORY.filter(r => {
      if (kw && !(r.code.toLowerCase().includes(kw) || r.name.toLowerCase().includes(kw))) return false;
      if (ind && r.industry !== ind) return false;
      if (start && r.date < start) return false;
      if (end && r.date > end) return false;
      return true;
    }).sort((a, b) => b.date.localeCompare(a.date) || a.code.localeCompare(b.code));

    document.getElementById('searchCount').textContent = `符合 ${rows.length} 筆`;

    const tableData = rows.map(r => [
      r.date, r.code, r.name, r.industry,
      r.close, (r.chg > 0 ? '▲' : (r.chg < 0 ? '▼' : '')) + Math.abs(r.chg),
      r.vol.toLocaleString(),
      (r.inst === null || r.inst === undefined) ? '無資料' : ((r.inst >= 0 ? '買超 +' : '賣超 ') + Math.abs(r.inst).toLocaleString())
    ]);

    const gridEl = document.getElementById('searchGrid');
    gridEl.innerHTML = '';
    gridInstance = new gridjs.Grid({
      columns: ['日期', '代號', '名稱', '產業別', '收盤', '漲跌', '成交量(張)', '三大法人買賣超'],
      data: tableData,
      sort: true,
      pagination: { limit: 20 },
      style: { table: { fontSize: '13px' } }
    }).render(gridEl);
  }

  document.getElementById('searchBtn').onclick = runSearch;
  document.getElementById('searchText').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  document.getElementById('searchIndustry').addEventListener('change', runSearch);
  searchStartPicker.onchange = runSearch;
  searchEndPicker.onchange = runSearch;
  runSearch();
}

// 初始渲染
renderGroupsTab();
</script>
